# Second deployment of the same image: a workspace for the Agent Swarm demo swarm.
# No built-in bot (DEMO_BOT=off); the swarm connects over Socket Mode with the
# tokens in the app secrets (SLACK_MOCK_BOT_TOKEN / SLACK_MOCK_APP_TOKEN, plus
# ADMIN_AUTH for /mock/*). Deploy: flyctl deploy --remote-only -c fly.swarm.toml
app = "slack-mock-swarm"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_FILE = "/data/slack.jsonl"
  PUBLIC_URL = "https://swarm-demo.slack-mock.dev"
  RESET_EVERY_HOURS = "24"
  DEMO_BOT = "off"
  UI_PUBLIC = "true"
  APP_NAME = "Agent Swarm"
  SEED_FILE = "/app/seeds/agent-swarm-demo.json"
  DRIVER_INTERVAL_MINUTES = "20"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
