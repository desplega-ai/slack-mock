name: release
# Publishes to npm whenever the version in package.json on main is not on the registry yet,
# then tags the commit (v<version>) and creates a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Decide whether this version needs publishing
        id: check
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NPM_TOKEN_SET" != "true" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping publish of $NAME@$VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: bun run typecheck && bun run lint && bun test
      - if: steps.check.outputs.publish == 'true'
        run: bun run build
      - if: steps.check.outputs.publish == 'true'
        # Provenance needs a public repository; skip the flag while the repo is private.
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish --provenance --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.check.outputs.publish == 'true'
        name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
